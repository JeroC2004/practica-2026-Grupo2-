<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container mt-5">

    <h1 class="titulo-principal mb-4">
        📊 Estadísticas
    </h1>

    <div class="row">

        <div class="col-md-4 mb-3">

            <div class="card shadow dashboard-card text-center">

                <div class="card-body">

                    <h5>Libres</h5>

                    <h1>{{ libres }}</h1>

                </div>

            </div>

        </div>

        <div class="col-md-4 mb-3">

            <div class="card shadow dashboard-card text-center">

                <div class="card-body">

                    <h5>Reservadas</h5>

                    <h1>{{ reservadas }}</h1>

                </div>

            </div>

        </div>

        <div class="col-md-4 mb-3">

            <div class="card shadow dashboard-card text-center">

                <div class="card-body">

                    <h5>Ocupadas</h5>

                    <h1>{{ ocupadas }}</h1>

                </div>

            </div>

        </div>

    </div>

    <div class="row mt-4">

        <div class="col">

            <div class="card shadow ocupacion-card text-center">

                <div class="card-body">

                    <h4>Porcentaje de ocupación</h4>

                    <h1>{{ porcentaje }}%</h1>

                </div>

            </div>

        </div>

    </div>

    <div class="footer-volver">

        <a href="/"
           class="btn btn-secondary">
            Volver
        </a>

    </div>

</div>

</body>
</html>
